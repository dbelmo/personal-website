services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: david-belmonte-site:latest
    container_name: personal-website
    ports:
      - "${PORT:-8080}:8080"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
