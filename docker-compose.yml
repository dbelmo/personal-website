services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: david-belmonte-site:latest
    container_name: personal-website
    ports:
      - "${PORT:-8080}:8080"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped

  # Optional: Automatic Let's Encrypt HTTPS + HTTP/3 for small VM deployments
  # Start with: SITE_DOMAIN=yourdomain.com docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: personal-website-tls
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
